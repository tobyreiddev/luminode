[package]
name = "luminode"
version = "0.1.0"
description = "Ambient LED status app driving an APA102 strip over an Arduino Micro"
authors = ["Toby Reid"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "luminode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Start-at-login toggle (tray menu) and native save/open dialogs for
# config export/import.
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
# `bundled` compiles SQLite from source so there is no system dependency.
rusqlite = { version = "0.31", features = ["bundled"] }
# Tauri's async runtime is tokio; we depend on it directly for the unix
# socket listener (lightctl) and the broadcast event bus.
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "rt", "macros"] }
# Slack + calendar polling. rustls so there's no OpenSSL system dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# OS keychain for integration secrets (secrets policy: never SQLite/JSON).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# ICS timestamp parsing for the calendar source.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
# CFString/CFRunLoop wrappers for the screen-lock notification observer.
core-foundation = "0.10"
